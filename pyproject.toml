[project]
name = "gh-desk"
version = "0.2.0"
description = "A local-first GitHub terminal workbench powered by gh"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["mutations.py", "projections.py", "models.py", "ports.py", "app_state.py", "config.py"]
strict = true
follow_imports = "silent"
